services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: control_tower
      POSTGRES_USER: postgres
      # For local use only. In production, override via an untracked .env file
      # (see deployment/README.md). Never commit a real password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_tower"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      # The app creates its own tables on startup via SQLAlchemy, so no manual
      # schema load is needed. To use a managed database instead of this local
      # postgres service, set DATABASE_URL in an untracked .env file.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/control_tower}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data

  frontend:
    build:
      context: ../frontend
      args:
        # Empty = the browser calls the host's :8000 (fine for local compose).
        # For a real deployment set this to your public API URL.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  app_data:
