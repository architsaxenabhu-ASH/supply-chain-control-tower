services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: control_tower
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/control_tower
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - app_data:/app/data

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  app_data:

